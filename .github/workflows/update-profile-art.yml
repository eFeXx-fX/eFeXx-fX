# Atualiza o gráfico de contribuições do perfil uma vez por dia.
# Roda scripts/contribuicoes.py e scripts/grafico.py e só faz commit se o
# contrib-heatmap.svg mudou. Não usa token extra nem segredo.
name: Atualizar grafico do perfil

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia 09:17 UTC (06:17 em Brasília)
  workflow_dispatch:        # botão "Run workflow" na aba Actions

# nenhuma permissão por padrão; o job abaixo pede só o que precisa
permissions: {}

concurrency:
  group: atualizar-grafico
  cancel-in-progress: false

jobs:
  grafico:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # só para gravar o SVG atualizado
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Instalar dependências (versões fixas)
        run: python -m pip install --no-cache-dir -r scripts/requirements.txt

      - name: Buscar contribuições e desenhar o gráfico
        env:
          GRAFICO_USUARIO: eFeXx-fX
        run: |
          python scripts/contribuicoes.py
          python scripts/grafico.py

      - name: Commit só se o SVG mudou
        run: |
          if git diff --quiet -- contrib-heatmap.svg; then
            echo "Gráfico igual ao anterior, nada a fazer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg
          git commit -m "Atualiza gráfico de contribuições"
          git push
